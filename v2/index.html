    <script>
      // theme before first paint, so a dark-mode visitor never sees a white flash
      try { var t = localStorage.getItem('pl-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); if (t === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
      // GitHub Pages sends deep links to 404.html, which stores the path here
      try { var r = sessionStorage.getItem('pl-redirect'); if (r) { sessionStorage.removeItem('pl-redirect'); history.replaceState(null, '', r); } } catch (e) {}
